<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 240px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, -apple-system, sans-serif;
      }
      h1 { margin: 0 0 12px; font-size: 14px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .status { margin-top: 10px; opacity: 0.7; font-size: 12px; }
      .switch { position: relative; width: 40px; height: 22px; flex: none; }
      .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
      .track {
        position: absolute; inset: 0; border-radius: 11px;
        background: #bbb; transition: background 0.15s; pointer-events: none;
      }
      .track::after {
        content: ''; position: absolute; top: 3px; left: 3px;
        width: 16px; height: 16px; border-radius: 50%;
        background: #fff; transition: transform 0.15s;
      }
      .switch input:checked + .track { background: #c00; }
      .switch input:checked + .track::after { transform: translateX(18px); }
      button {
        margin-top: 14px; width: 100%; padding: 6px;
        font: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>YouTube Ad Speed-Up</h1>

    <div class="row">
      <label for="enabled">Enabled</label>
      <span class="switch">
        <input type="checkbox" id="enabled" />
        <span class="track"></span>
      </span>
    </div>

    <div class="status" id="status"></div>

    <button id="open-options">Settings…</button>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
